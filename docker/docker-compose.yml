version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    ports:
      - "5000:5000"
      - "5555:5555/udp"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET}
      - DB_PATH=/app/data/meshchat.db
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - CORS_ORIGIN=http://localhost:3000
    volumes:
      - ../database:/app/data
    networks:
      - meshnet
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://backend:5000/api
      - REACT_APP_SOCKET_URL=http://backend:5000
      - REACT_APP_BROADCAST_PORT=5555
    depends_on:
      - backend
    networks:
      - meshnet
    restart: unless-stopped

networks:
  meshnet:
    driver: bridge
